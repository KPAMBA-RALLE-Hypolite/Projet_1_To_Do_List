spring.application.name=todo-api

# =====================================================
# Configuration de l'application Todo API
# =====================================================

# --- Serveur ---
server.port=8080

# --- Base de données H2 (en mémoire) ---
spring.datasource.url=jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# create-drop : recrée le schéma à chaque démarrage (pratique en développement)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Console H2 (interface web pour inspecter la BDD) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Logs ---
logging.level.com.kfokam=DEBUG
logging.level.org.springframework.web=INFO
